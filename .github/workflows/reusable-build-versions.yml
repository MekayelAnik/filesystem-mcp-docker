name: Reusable Build Versions

on:
  workflow_call:
    inputs:
      versions_json:
        description: JSON matrix include payload for versions
        required: true
        type: string
      build_profile:
        description: Build profile
        required: false
        type: string
        default: production
      force_build:
        description: Force build even if tags may already exist
        required: false
        type: string
        default: 'false'
      base_image_default:
        description: Base image used by DockerfileModifier
        required: true
        type: string
      haproxy_image:
        description: HAProxy image for QUIC/H3 support (GHCR mirror with Docker Hub fallback)
        required: false
        type: string
        default: 'haproxy:lts-alpine'
      ghcr_repo:
        description: GHCR repository
        required: true
        type: string
      dockerhub_repo:
        description: Docker Hub repository
        required: true
        type: string
      default_platforms:
        description: Build platforms (informational — actual platforms defined in matrix)
        required: true
        type: string
      export_cache_concurrency:
        description: Buildx export cache concurrency
        required: false
        type: string
        default: '4'
      export_layers_concurrency:
        description: Buildx export layers concurrency
        required: false
        type: string
        default: '4'
      buildkit_step_log_max_size:
        description: BuildKit step log max size
        required: false
        type: string
        default: '50000000'
      buildkit_step_log_max_speed:
        description: BuildKit step log max speed
        required: false
        type: string
        default: '100000000'
      buildkit_progress:
        description: BuildKit progress mode
        required: false
        type: string
        default: plain
      docker_buildkit_inline_cache:
        description: BuildKit inline cache
        required: false
        type: string
        default: '1'
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub token
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # ── Prepare cross-product matrix: versions × platforms ──
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      versions: ${{ steps.generate.outputs.versions }}
    steps:
      - name: Generate version × platform matrix
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          VERSIONS_JSON='${{ inputs.versions_json }}'
          PLATFORMS='[
            {"platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"},
            {"platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}
          ]'

          # Cross-product: each version × each platform
          MATRIX=$(echo "$VERSIONS_JSON" | jq -c --argjson platforms "$PLATFORMS" '
            [.[] as $v | $platforms[] as $p | {
              version: $v.version,
              image_tag: $v.image_tag,
              promote_latest: $v.promote_latest,
              platform: $p.platform,
              runner: $p.runner,
              slug: $p.slug
            }]
          ')

          # Deduplicated version list for merge job
          VERSIONS=$(echo "$VERSIONS_JSON" | jq -c '[.[] | {version, image_tag, promote_latest}]')

          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "versions={\"include\":$VERSIONS}" >> "$GITHUB_OUTPUT"

          COUNT=$(echo "$MATRIX" | jq length)
          echo "Generated $COUNT build jobs (versions × platforms)"

  # ── Per-platform native build (no QEMU for amd64/arm64) ──
  build-platform:
    name: Build ${{ matrix.version }} (${{ matrix.slug }})
    needs: [prepare-matrix]
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: build-${{ matrix.version }}-${{ matrix.slug }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Sanitize inputs (trim whitespace)
        id: sanitize
        shell: bash
        run: |
          set -euo pipefail
          trim() { local v="$*"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}" ; printf '%s' "$v"; }
          echo "ghcr_repo=$(trim '${{ inputs.ghcr_repo }}')" >> "$GITHUB_OUTPUT"
          echo "dockerhub_repo=$(trim '${{ inputs.dockerhub_repo }}')" >> "$GITHUB_OUTPUT"
          echo "base_image_default=$(trim '${{ inputs.base_image_default }}')" >> "$GITHUB_OUTPUT"
          echo "haproxy_image=$(trim '${{ inputs.haproxy_image }}')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build profile
        id: profile
        uses: ./.github/actions/resolve-build-profile
        with:
          build_profile: ${{ inputs.build_profile }}

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          do_checkout: 'false'
          setup_qemu: 'false'
          setup_buildx: 'true'
          login_dockerhub: 'true'
          login_ghcr: 'true'
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr_actor: ${{ github.actor }}
          ghcr_token: ${{ github.token }}

      - name: Check existing tags
        id: check-existing
        shell: bash
        run: |
          set -euo pipefail

          RESULT="$({ FORCE_BUILD="${{ inputs.force_build }}" GHCR_REPO="${{ steps.sanitize.outputs.ghcr_repo }}" VERSION="${{ matrix.version }}" bash .github/scripts/check-existing-tags.sh; } )"
          echo "$RESULT"
          SKIP_LINE="$(echo "$RESULT" | awk -F= '/^skip_build=/{print $0}' | tail -n1)"
          if [[ -z "$SKIP_LINE" ]]; then
            echo "check-existing-tags did not return skip_build output" >&2
            exit 1
          fi
          echo "$SKIP_LINE" >> "$GITHUB_OUTPUT"

      - name: Generate Dockerfile via DockerfileModifier.sh
        if: steps.check-existing.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Using base image: ${{ steps.sanitize.outputs.base_image_default }}"
          mkdir -p build_data
          echo "${{ steps.sanitize.outputs.base_image_default }}" > ./build_data/base-image

          # Resolve HAProxy image with fallback: try GHCR mirror, fall back to Docker Hub
          HAPROXY_IMG="${{ steps.sanitize.outputs.haproxy_image }}"
          if ! crane digest "$HAPROXY_IMG" >/dev/null 2>&1; then
            HAPROXY_FALLBACK="${HAPROXY_IMG##*/}"
            echo "HAProxy image '$HAPROXY_IMG' not available, falling back to '$HAPROXY_FALLBACK'"
            HAPROXY_IMG="$HAPROXY_FALLBACK"
          fi
          echo "Using HAProxy image: $HAPROXY_IMG"
          echo "$HAPROXY_IMG" > ./build_data/haproxy-image

          echo "${{ matrix.version }}" > ./build_data/version
          touch ./build_data/build
          bash ./DockerfileModifier.sh
          test -f ./Dockerfile.filesystem-mcp

      - name: Build and push by digest
        id: build
        if: steps.check-existing.outputs.skip_build != 'true'
        env:
          BUILDKIT_STEP_LOG_MAX_SIZE: ${{ inputs.buildkit_step_log_max_size }}
          BUILDKIT_STEP_LOG_MAX_SPEED: ${{ inputs.buildkit_step_log_max_speed }}
          BUILDKIT_PROGRESS: ${{ inputs.buildkit_progress }}
          DOCKER_BUILDKIT_INLINE_CACHE: ${{ inputs.docker_buildkit_inline_cache }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.filesystem-mcp
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.sanitize.outputs.ghcr_repo }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,${{ steps.profile.outputs.compression_params }},export-cache-concurrency=${{ inputs.export_cache_concurrency }},export-layers-concurrency=${{ inputs.export_layers_concurrency }}
          cache-from: type=gha,scope=filesystem-${{ matrix.version }}-${{ matrix.slug }}
          cache-to: type=gha,scope=filesystem-${{ matrix.version }}-${{ matrix.slug }},mode=max,compression=zstd
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            FILESYSTEM_VERSION=${{ matrix.version }}
            BASE_IMAGE=${{ steps.sanitize.outputs.base_image_default }}
          provenance: false
          sbom: false

      - name: Export digest
        if: steps.check-existing.outputs.skip_build != 'true'
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Platform ${{ matrix.slug }} digest: $digest"
          echo "$digest" > "/tmp/digests/${{ matrix.slug }}"

      - name: Upload digest
        if: steps.check-existing.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.version }}-${{ matrix.slug }}
          path: /tmp/digests/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 1

  # ── Merge per-platform digests into multi-arch manifest ──
  merge-manifest:
    name: Merge ${{ matrix.version }}
    needs: [prepare-matrix, build-platform]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.versions) }}

    steps:
      - name: Sanitize inputs
        id: sanitize
        shell: bash
        run: |
          set -euo pipefail
          trim() { local v="$*"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}" ; printf '%s' "$v"; }
          echo "ghcr_repo=$(trim '${{ inputs.ghcr_repo }}')" >> "$GITHUB_OUTPUT"
          echo "dockerhub_repo=$(trim '${{ inputs.dockerhub_repo }}')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          do_checkout: 'false'
          setup_qemu: 'false'
          setup_buildx: 'true'
          login_dockerhub: 'true'
          login_ghcr: 'true'
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr_actor: ${{ github.actor }}
          ghcr_token: ${{ github.token }}

      - name: Download all platform digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.version }}-*
          merge-multiple: true

      - name: Create multi-arch manifest and push tags
        shell: bash
        run: |
          set -euo pipefail

          GHCR_REPO="${{ steps.sanitize.outputs.ghcr_repo }}"
          DH_REPO="${{ steps.sanitize.outputs.dockerhub_repo }}"
          VERSION="${{ matrix.version }}"
          IMAGE_TAG="${{ matrix.image_tag }}"

          echo "Merging platform digests for $VERSION"
          ls -la /tmp/digests/

          # Collect all digest sources
          SOURCES=""
          for f in /tmp/digests/*; do
            DIGEST="$(cat "$f")"
            SLUG="$(basename "$f")"
            echo "  $SLUG: $DIGEST"
            SOURCES+="${GHCR_REPO}@${DIGEST} "
          done

          if [[ -z "$SOURCES" ]]; then
            echo "No digests found — skipping manifest merge"
            exit 0
          fi

          echo "Creating multi-arch manifest with tags:"
          echo "  GHCR: $GHCR_REPO:$VERSION, $GHCR_REPO:$IMAGE_TAG"
          echo "  DH:   $DH_REPO:$VERSION, $DH_REPO:$IMAGE_TAG"

          # Create manifest list with all tags (GHCR + Docker Hub)
          docker buildx imagetools create \
            -t "${GHCR_REPO}:${VERSION}" \
            -t "${GHCR_REPO}:${IMAGE_TAG}" \
            -t "${DH_REPO}:${VERSION}" \
            -t "${DH_REPO}:${IMAGE_TAG}" \
            $SOURCES

          echo "Multi-arch manifest created successfully"

      - name: Verify Docker Hub parity (fallback sync)
        uses: ./.github/actions/registry-sync
        with:
          dockerhub_repo: ${{ steps.sanitize.outputs.dockerhub_repo }}
          ghcr_repo: ${{ steps.sanitize.outputs.ghcr_repo }}
          tags: ${{ matrix.image_tag }},${{ matrix.version }}
